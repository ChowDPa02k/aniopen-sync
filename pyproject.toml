[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aniopen-sync"
version = "0.3.0"
description = "ANi RSS sync with a configuration console and read-only download tracking"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "apscheduler>=3.11,<4", "requests>=2.32.4,<3", "PyYAML>=6.0.2,<7",
  "defusedxml>=0.7.1,<1", "bencodepy>=0.9.5,<1", "filelock>=3.16,<4",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[project.scripts]
aniopen-sync = "aniopen_sync.__main__:main"
[tool.setuptools.packages.find]
include = ["aniopen_sync*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
