name: Container image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.7'
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Check architecture, s6 and dependency recovery
        env:
          IMAGE: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "$ARCH"
          uv run python scripts/check_container_health.py --image "$IMAGE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image
        env:
          IMAGE: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "$IMAGE"
          mkdir -p digests
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > "digests/$ARCH.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*.txt
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Image name and current main
        id: name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "latest=$([[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" == "$current" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.name.outputs.latest }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        env:
          META: ${{ steps.meta.outputs.json }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          mapfile -t sources < <(cat digests/amd64.txt digests/arm64.txt)
          mapfile -t tags < <(jq -r '.tags[] | "--tag", .' <<< "$META")
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          ref="$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools inspect "$ref" --raw | jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]'
          docker buildx imagetools inspect "$ref" >> "$GITHUB_STEP_SUMMARY"
